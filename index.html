<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silver Oak University | Unified ERP Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Plus Jakarta Sans', sans-serif; } 
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden selection:bg-indigo-600 selection:text-white">
    <!-- Ambient Glow Effects -->
    <div class="absolute -top-32 -left-32 w-72 sm:w-96 h-72 sm:h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-72 sm:w-96 h-72 sm:h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Notification Toast Container -->
    <div id="toast-box" class="fixed top-4 right-4 left-4 sm:left-auto sm:w-96 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-xl border border-slate-700/60 rounded-2xl sm:rounded-3xl p-5 sm:p-8 shadow-2xl relative z-10 mx-auto">
        <!-- University Academic Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 bg-gradient-to-tr from-indigo-600 to-indigo-500 rounded-2xl mb-3 shadow-lg shadow-indigo-600/30">
                <i class="fa-solid fa-graduation-cap text-2xl sm:text-3xl text-white"></i>
            </div>
            <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight">Silver Oak University</h1>
            <p class="text-[11px] sm:text-xs text-indigo-400 font-semibold mt-1">Student Portal</p>
            <p class="text-[10px] text-slate-400 uppercase tracking-wider mt-0.5">AI Help Desk</p>
        </div>

        <!-- Universal Login Form -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                    Identifier
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-id-badge text-sm"></i>
                    </span>
                    <input type="text" id="identifier" required placeholder="Enrollment / Username"
                        class="w-full pl-10 pr-4 py-3 bg-slate-900/60 border border-slate-700 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-slate-500 text-sm outline-none transition">
                </div>
                <p class="text-[10px] text-slate-400 mt-1.5 flex items-center gap-1">
                    <i class="fa-solid fa-circle-info text-[9px] text-indigo-400"></i>
                    <span>Student: Enrollment No. | Faculty: Username</span>
                </p>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 pointer-events-none">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" id="password" required placeholder="••••••••••••"
                        class="w-full pl-10 pr-10 py-3 bg-slate-900/60 border border-slate-700 rounded-xl focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white placeholder-slate-500 text-sm outline-none transition">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-eye text-xs" id="toggle-pwd-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="submit-btn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2 text-sm">
                <span>Sign In to Portal</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>

        
    </div>

    <script>
        const API_BASE = (window.location.protocol === 'file:' || (window.location.port !== '3000' && window.location.port !== '')) 
            ? 'http://localhost:3000' 
            : '';

        function togglePasswordVisibility() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('toggle-pwd-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function showToast(message, isSuccess = false) {
            const container = document.getElementById('toast-box');
            const toast = document.createElement('div');
            toast.className = `p-3.5 rounded-xl shadow-2xl border text-xs pointer-events-auto flex items-center transition-all duration-300 ${
                isSuccess ? 'bg-emerald-950/95 border-emerald-500 text-emerald-200' : 'bg-rose-950/95 border-rose-500 text-rose-200'
            }`;
            toast.innerHTML = `<i class="fa-solid ${isSuccess ? 'fa-check text-emerald-400' : 'fa-triangle-exclamation text-rose-400'} mr-2.5 text-sm"></i><span class="font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'scale-95');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i>Authenticating...`;

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });

                const text = await res.text();
                const data = text ? JSON.parse(text) : {};

                if (!res.ok) throw new Error(data.error || "Authentication failed");

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                showToast(`Welcome, ${data.user.name}! Routing...`, true);

                setTimeout(() => {
                    if (data.user.role === 'admin') window.location.href = 'admin.html';
                    else if (data.user.role === 'faculty') window.location.href = 'faculty.html';
                    else window.location.href = 'student.html';
                }, 500);
            } catch (err) {
                showToast(err.message);
                btn.disabled = false;
                btn.innerHTML = `<span>Sign In to Portal</span><i class="fa-solid fa-arrow-right text-xs ml-2"></i>`;
            }
        }
    </script>
</body>
</html>
